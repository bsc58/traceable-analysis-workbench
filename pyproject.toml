[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceable-analysis-workbench"
version = "0.1.0"
description = "Version-bound live analysis with durable evidence and verified facts"
requires-python = ">=3.12"
dependencies = ["sqlalchemy==2.0.43", "psycopg[binary]==3.2.10", "pydantic==2.11.7", "fastapi==0.116.1", "uvicorn==0.35.0", "jsonschema==4.25.1", "mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "pgserver==0.1.4"]

[project.scripts]
analysis-workbench = "analysis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
